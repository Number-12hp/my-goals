<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#faf9ff" />
<title>DonePlan</title>
<link rel="stylesheet" href="style.css?v=14" />
</head>
<body>

<div class="app">
  <!-- ══════════ 悬浮图标导航：平时只有图标，悬浮滑出文字气泡 ══════════ -->
  <aside class="sidebar" id="sidebar">
    <!-- 纯文字标：两行紧贴堆叠、左对齐（原来的图形 logo 已移除） -->
    <div class="rail-brand" aria-hidden="true">
      <span>L1A0</span>
      <span>DonePlan</span>
    </div>

    <nav class="rail-nav" id="nav" aria-label="主导航">
      <button class="rail-btn nav-item on" type="button" data-view="goals">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6.6h16M4 12h16M4 17.4h10" />
          <circle cx="2.6" cy="6.6" r="1" fill="currentColor" stroke="none" />
          <circle cx="2.6" cy="12" r="1" fill="currentColor" stroke="none" />
          <circle cx="2.6" cy="17.4" r="1" fill="currentColor" stroke="none" />
        </svg>
        <span class="tip" data-i18n="navGoals">目标</span>
      </button>

      <button class="rail-btn nav-item" type="button" data-view="calendar">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.2" y="4.8" width="17.6" height="15.4" rx="3" />
          <path d="M3.2 9.6h17.6M8 3v3.4M16 3v3.4" />
        </svg>
        <span class="tip" data-i18n="navCalendar">日历</span>
      </button>

      <button class="rail-btn nav-item" type="button" data-view="achieve">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3.6h8v4.6a4 4 0 0 1-8 0V3.6Z" />
          <path d="M8 4.8H5.4a2.4 2.4 0 0 0 2.6 3M16 4.8h2.6a2.4 2.4 0 0 1-2.6 3" />
          <path d="M12 12.2v3.2M8.6 19.4h6.8l-.6-4H9.2l-.6 4Z" />
        </svg>
        <span class="tip" data-i18n="achieve">成就</span>
      </button>

      <button class="rail-btn nav-item" type="button" data-view="stats">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 19.5V11M9.8 19.5V5M15.2 19.5v-6M20.5 19.5V8" />
        </svg>
        <span class="tip" data-i18n="navStats">统计</span>
      </button>

      <button class="rail-btn nav-item" type="button" data-view="settings">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.1" />
          <path d="M12 2.6v2.6M12 18.8v2.6M21.4 12h-2.6M5.2 12H2.6M18.6 5.4l-1.8 1.8M7.2 16.8l-1.8 1.8M18.6 18.6l-1.8-1.8M7.2 7.2 5.4 5.4" />
        </svg>
        <span class="tip" data-i18n="navSettings">设置</span>
      </button>
    </nav>

    <div class="rail-foot">
      <!-- 收纳菜单：语言 / 主题 / 账号都收进这个气泡，从根上避免"菜单套菜单" -->
      <div class="menu-wrap" id="menuWrap">
        <button class="rail-btn" id="menuBtn" type="button"
                aria-haspopup="dialog" aria-expanded="false" aria-controls="toolPanel">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor">
            <circle cx="5.4" cy="12" r="1.9" /><circle cx="12" cy="12" r="1.9" /><circle cx="18.6" cy="12" r="1.9" />
          </svg>
          <span class="tip" data-i18n="menuLabel">菜单</span>
        </button>

        <div class="tool-panel" id="toolPanel" role="dialog" aria-modal="false"
             aria-label="菜单" data-i18n-aria="menuLabel" hidden>
          <div class="panel-row">
            <button id="langBtn" class="icon-btn" type="button"
                    aria-expanded="false" aria-controls="langMenu"
                    aria-label="切换语言" data-i18n-aria="langAria">
              <svg id="langIcon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"
                   fill="none" stroke="currentColor" stroke-width="1.7"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 5.5h8M7 3.5v2c0 3.6-1.8 6.6-4 8.2" />
                <path d="M5 10.2c1.6 2.6 3.6 4.3 5.8 5.3" />
                <path d="M12.6 20.5 17 8.5l4.4 12" />
                <path d="M14.3 16.6h5.4" />
              </svg>
              <span class="panel-label" data-i18n="langShort">语言</span>
            </button>

            <button id="themeBtn" class="icon-btn" type="button"
                    aria-label="切换深色 / 浅色" data-i18n-aria="themeAria">
              <span id="themeGlyph" aria-hidden="true">☾</span>
              <span class="panel-label" data-i18n="themeShort">主题</span>
            </button>

            <button id="authBtn" class="icon-btn" type="button"
                    aria-haspopup="dialog" aria-expanded="false"
                    aria-label="登录 / 账号" data-i18n-aria="authAria">
              <svg id="userIcon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"
                   fill="none" stroke="currentColor" stroke-width="1.7"
                   stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8.5" r="3.6" />
                <path d="M4.8 20.2c1.1-3.6 3.9-5.6 7.2-5.6s6.1 2 7.2 5.6" />
              </svg>
              <span class="auth-dot" id="authDot" aria-hidden="true"></span>
              <span class="panel-label" data-i18n="userShort">账号</span>
            </button>
          </div>

          <!-- 配色皮肤：4 个色块，点一下整套变量跟着换 -->
          <div class="panel-skins" id="skinRow" role="radiogroup"
               aria-label="主题" data-i18n-aria="themeShort">
            <button class="skin" type="button" role="radio" aria-checked="true" data-skin="paper">
              <span class="skin-chip skin-paper" aria-hidden="true"></span>
              <span class="panel-label" data-i18n="skinPaper">纸墨</span>
            </button>
            <button class="skin" type="button" role="radio" aria-checked="false" data-skin="iris">
              <span class="skin-chip skin-iris" aria-hidden="true"></span>
              <span class="panel-label" data-i18n="skinIris">鸢尾</span>
            </button>
            <button class="skin" type="button" role="radio" aria-checked="false" data-skin="cobalt">
              <span class="skin-chip skin-cobalt" aria-hidden="true"></span>
              <span class="panel-label" data-i18n="skinCobalt">钴蓝</span>
            </button>
            <button class="skin" type="button" role="radio" aria-checked="false" data-skin="lime">
              <span class="skin-chip skin-lime" aria-hidden="true"></span>
              <span class="panel-label" data-i18n="skinLime">青柠</span>
            </button>
          </div>

          <!-- 语言手风琴：撑开的是面板自身，不再有浮在外面的下拉层 -->
          <div id="langMenu" class="lang-acc" role="menu" hidden></div>
        </div>
      </div>

      <!-- 状态指示器：侧栏最底端的基准，文字收进气泡 -->
      <button type="button" class="rail-btn" id="syncPill" data-state="local"
              aria-haspopup="dialog" aria-expanded="false">
        <span class="sync-dot" aria-hidden="true"></span>
        <span class="tip" id="syncText">仅本机保存</span>
      </button>
    </div>
  </aside>

  <!-- ══════════ 主内容区 ══════════ -->
  <main class="main">

    <!-- ───── 视图一：目标 ───── -->
    <section class="view" id="view-goals" data-view="goals">
      <header class="view-head">
        <h1 class="view-title" data-i18n="navGoals">目标</h1>
        <p class="view-sub" data-i18n="subtitle">把想做的事写下来，完成一项就轻轻打个勾。</p>
      </header>

      <!-- 今日完成进度（数据由 renderStats() 填） -->
      <div class="progress-card" id="progressCard"></div>

      <!-- ══ 内联双模板录入：Tab 就地切换，全程不弹窗 ══ -->
      <section class="composer" id="composer">
        <div class="cp-tabs" id="cpTabs" role="tablist">
          <button class="cp-tab on" type="button" role="tab" aria-selected="true" data-entry="idea">
            <span aria-hidden="true">💡</span> <span data-i18n="tabIdea">记想法</span>
          </button>
          <button class="cp-tab" type="button" role="tab" aria-selected="false" data-entry="plan">
            <span aria-hidden="true">📅</span> <span data-i18n="tabPlan">定计划</span>
          </button>
        </div>

        <form class="cp-row" id="form" autocomplete="off" novalidate>
          <input id="title" class="cp-input" type="text" maxlength="80"
                 placeholder="想做点什么？" aria-label="目标内容"
                 data-i18n-ph="ph" data-i18n-aria="goalAria" />

          <!-- 可创建式分类器：不是 <select>，可以直接打字新建 -->
          <div class="combo" id="catCombo">
            <input id="catInput" class="combo-input" type="text" autocomplete="off" spellcheck="false"
                   role="combobox" aria-expanded="false" aria-controls="catMenu" aria-autocomplete="list"
                   placeholder="分类" data-i18n-ph="catPh" data-i18n-aria="catPh" />
            <div class="combo-menu" id="catMenu" role="listbox" hidden></div>
          </div>

          <!-- 只有「定计划」模板才出现：日期（必填）+ 循环规则 -->
          <span class="cp-plan-only" id="planOnly">
            <input id="date" class="cp-date" type="date" aria-label="日期" data-i18n-aria="dateAria" />
            <button id="loopBtn" class="cp-loop" type="button">
              <span aria-hidden="true">↻</span> <span id="loopLabel" data-i18n="loopNone">不循环</span>
            </button>
          </span>

          <button class="add-btn" type="submit"><span data-i18n="add">添加</span></button>
        </form>
        <p class="cp-hint" id="hint"></p>
      </section>

      <!-- ══ 灵感箱：还没排期的想法 ══ -->
      <section class="lane">
        <header class="lane-head">
          <h2 class="lane-title"><span aria-hidden="true">💡</span> <span data-i18n="inboxTitle">灵感箱</span></h2>
          <span class="lane-count" id="inboxCount">0</span>
        </header>
        <div id="inboxList"></div>
      </section>

      <!-- ══ 行动列表：排好期的想法 + 直接创建的计划 ══ -->
      <section class="lane">
        <header class="lane-head">
          <h2 class="lane-title"><span aria-hidden="true">🔥</span> <span data-i18n="actionTitle">行动列表</span></h2>
          <span class="lane-count" id="actionCount">0</span>
        </header>
        <div id="actionList"></div>
      </section>

      <footer class="foot">
        <span class="sync-progress" id="syncProgress"></span>
      </footer>
    </section>

    <!-- ───── 视图二：日历 ───── -->
    <section class="view" id="view-calendar" data-view="calendar" hidden>
      <header class="view-head">
        <h1 class="view-title" data-i18n="navCalendar">日历</h1>
        <p class="view-sub" data-i18n="calSub">点任意日期，看那天的计划。</p>
      </header>

      <div class="cal-card">
        <div class="cal-top">
          <button class="cal-nav" id="calPrev" type="button" aria-label="上个月" data-i18n-aria="calPrev">‹</button>
          <span class="cal-title" id="calTitle">2026 年 9 月</span>
          <button class="cal-nav" id="calNext" type="button" aria-label="下个月" data-i18n-aria="calNext">›</button>
        </div>
        <div class="cal-grid" id="calGrid" role="grid" aria-label="月历" data-i18n-aria="navCalendar"></div>
        <div class="cal-legend">
          <span class="lg todo"><i aria-hidden="true"></i><span data-i18n="calNone">未完成</span></span>
          <span class="lg part"><i aria-hidden="true"></i><span data-i18n="calPart">部分完成</span></span>
          <span class="lg all"><i aria-hidden="true"></i><span data-i18n="calAll">全部完成</span></span>
        </div>
      </div>

      <div class="cal-daycard">
        <div class="cal-dayhead">
          <span class="cal-daytitle" id="calDayHead"></span>
          <span class="cal-count" id="calCount"></span>
        </div>
        <div class="list" id="calList" hidden></div>
        <p class="cal-empty" id="calEmpty" data-i18n="calNoTask">这天没有计划</p>
      </div>
    </section>

    <!-- ───── 视图三：成就陈列室（按 category 分组）───── -->
    <section class="view" id="view-achieve" data-view="achieve" hidden>
      <header class="view-head">
        <h1 class="view-title" data-i18n="achieve">成就</h1>
        <p class="view-sub" data-i18n="achieveSub">按分类陈列已经完成的事。</p>
      </header>

      <div class="shelves" id="shelves"></div>

      <footer class="foot">
        <span class="sync-progress" id="doneTotal"></span>
        <button id="clearDone" class="link-btn" type="button" data-i18n="clearDone">清空已完成</button>
      </footer>
    </section>

    <!-- ───── 其余视图：占位（后续实现）───── -->

    <section class="view" id="view-stats" data-view="stats" hidden>
      <header class="view-head">
        <h1 class="view-title" data-i18n="navStats">统计</h1>
      </header>
      <div class="soon">
        <p class="soon-title" data-i18n="soon">这个模块还在开发中</p>
        <p class="soon-hint" data-i18n="subtitle">把想做的事写下来，完成一项就轻轻打个勾。</p>
      </div>
    </section>

    <section class="view" id="view-settings" data-view="settings" hidden>
      <header class="view-head">
        <h1 class="view-title" data-i18n="navSettings">设置</h1>
      </header>
      <div class="soon">
        <p class="soon-title" data-i18n="soon">这个模块还在开发中</p>
        <p class="soon-hint" data-i18n="subtitle">把想做的事写下来，完成一项就轻轻打个勾。</p>
      </div>
    </section>

    <span id="cloudHost" class="cloud-host" hidden></span>
  </main>
</div>

<!-- ═══ 登录 / 账号弹窗（默认隐藏；点用户图标或底部状态栏呼出）═══ -->
<div class="modal" id="authModal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <button class="modal-close" id="authClose" type="button" aria-label="关闭" data-close>✕</button>

    <div id="authSignin">
      <h2 class="auth-title" id="authTitle" data-i18n="signInTitle">登录后云端同步</h2>
      <p class="auth-hint" data-i18n="signInHint">登录后，换浏览器或换设备都能找回你的清单。</p>

      <form id="authForm" autocomplete="on" novalidate>
        <label class="auth-field">
          <span data-i18n="email">邮箱</span>
          <input id="authEmail" type="email" name="email" autocomplete="username"
                 inputmode="email" spellcheck="false" data-i18n-ph="email" placeholder="you@example.com" />
        </label>
        <label class="auth-field">
          <span data-i18n="password">密码</span>
          <input id="authPass" type="password" name="password" autocomplete="current-password"
                 data-i18n-ph="password" placeholder="••••••" />
        </label>

        <p class="auth-msg" id="authMsg" role="status" aria-live="polite"></p>

        <button class="auth-submit" id="authSubmit" type="submit" data-i18n="signIn">登录</button>

        <div class="auth-links">
          <button type="button" class="auth-link" id="authToggle" data-i18n="toSignUp">没有账号？注册</button>
          <button type="button" class="auth-link" id="authForgot" data-i18n="forgot">忘记密码</button>
        </div>
      </form>
    </div>

    <div class="auth-account" id="authAccount" hidden>
      <p class="auth-account-label" data-i18n="accountLabel">当前账号</p>
      <p class="auth-account-mail" id="authAccountMail"></p>
      <button class="auth-submit auth-signout" id="signOutBtn" type="button" data-i18n="signOut">退出登录</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="undo" id="undo" role="status" aria-live="polite"></div>

<!-- Supabase 客户端：加载失败也不影响本地功能 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<script src="app.js?v=13"></script>
</body>
</html>
